<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YerimBurada - Türkiye'nin Premium Ticaret Ağı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern Tasarım Stilleri */
        :root { --yb-turuncu: #ff3b00; --yb-karanlik: #090d16; }
        body { background: #f3f4f6; font-family: 'Inter', sans-serif; }
        header { background: var(--yb-karanlik); border-bottom: 3px solid var(--yb-turuncu); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: 800; color: #fff; }
        .sidebar { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        .main-container { display: flex; gap: 20px; padding: 20px; max-width: 1400px; margin: auto; }
        .content-area { flex: 1; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cat-header { padding: 10px; cursor: pointer; font-weight: 600; }
        .panel-section { display: none; }
        .panel-section.active { display: block; }
        .btn-orange { background: var(--yb-turuncu); color: #fff; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">Yerim<span>Burada</span></a>
    <div id="auth-header">
        <button onclick="toggleAuthModal()" class="btn-orange">Giriş Yap / Üye Ol</button>
        <button onclick="ilanVerClick()" class="btn-orange">Ücretsiz İlan Ver</button>
    </div>
</header>

<div class="main-container">
    <div class="sidebar">
        <h3>KATEGORİLER</h3>
        <div class="cat-item"><div class="cat-header" onclick="showPage('ilanver')">1. Emlak</div></div>
        <div class="cat-item"><div class="cat-header" onclick="showPage('ilanver')">2. Vasıta</div></div>
        <div class="cat-item"><div class="cat-header" onclick="showPage('ilanver')">3. Yedek Parça</div></div>
        <div class="cat-item"><div class="cat-header" onclick="showPage('ilanver')">4. Alışveriş</div></div>
        <div class="cat-item"><div class="cat-header" onclick="showPage('ilanver')">5. İş İlanları</div></div>
        <div class="cat-item"><div class="cat-header" onclick="showPage('ilanver')">6. Hizmetler</div></div>
    </div>

    <div class="content-area">
        <div id="page-vitrin" class="panel-section active">
            <h2>Vitrin</h2>
        </div>
        <div id="page-ilanver" class="panel-section">
            <h2>İlan Verme Paneli</h2>
            <!-- Buraya istediğin tüm filtreler ve formlar gelecek -->
        </div>
    </div>
</div>

<script>
    let isLogged = false;

    function showPage(pageId) {
        document.querySelectorAll('.panel-section').forEach(p => p.style.display = 'none');
        document.getElementById('page-' + pageId).style.display = 'block';
    }

    function ilanVerClick() {
        if(!isLogged) {
            alert("İlan vermek için önce giriş yapmalısınız!");
            return;
        }
        showPage('ilanver');
    }

    function toggleAuthModal() {
        // Üyelik Modalı
        isLogged = true; // Simülasyon
        alert("Giriş Başarılı!");
        document.getElementById('auth-header').innerHTML = "<span>Hoş Geldin Emrah Kaya</span>";
    }
</script>

</body>
</html>
