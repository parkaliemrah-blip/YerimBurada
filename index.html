<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YerimBurada | Profesyonel İlan Ağı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --yb-turuncu: #ff3b00; --yb-karanlik: #090d16; --yb-bg: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--yb-bg); }
        
        /* Layout */
        .header { background: var(--yb-karanlik); color: #fff; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--yb-turuncu); }
        .container { display: flex; max-width: 1300px; margin: 30px auto; gap: 30px; padding: 0 20px; }
        
        /* Sidebar */
        .sidebar { width: 300px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .sidebar h3 { font-size: 14px; color: var(--yb-turuncu); margin-bottom: 15px; text-transform: uppercase; }
        .cat-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-weight: 600; }
        .cat-item:hover { color: var(--yb-turuncu); }

        /* Content */
        .main-content { flex: 1; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filter-box { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        
        /* Form */
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: var(--yb-turuncu); color: #fff; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 24px; font-weight: bold;">Yerim<span>Burada</span></div>
    <div>
        <button onclick="alert('Giriş sistemi aktif edilecek')" style="background:transparent; color:#fff; border:1px solid #fff; padding:10px;">Giriş Yap</button>
        <button class="btn-orange" style="background:var(--yb-turuncu); color:#fff; padding:10px 20px; border:none;">İlan Ver</button>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <h3>KATEGORİLER</h3>
        <div class="cat-item">1. Emlak</div>
        <div class="cat-item">2. Vasıta</div>
        <div class="cat-item">3. Yedek Parça</div>
        <div class="cat-item">4. Alışveriş</div>
    </div>

    <div class="main-content">
        <div class="filter-box">
            <h3>Detaylı Arama</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <input type="text" placeholder="Kategori">
                <input type="text" placeholder="Minimum Fiyat">
                <input type="text" placeholder="Maksimum Fiyat">
            </div>
            <button>İlanları Filtrele</button>
        </div>
        <div style="margin-top: 30px;">
            <h3>Vitrin İlanları</h3>
            <p>Henüz ilan yok.</p>
        </div>
    </div>
</div>

</body>
</html>
