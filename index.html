<!-- Sağ Filtreleme Alanı Güncellemesi -->
<div class="filter-card">
    <div class="filter-header">
        <i class="icon-filter"></i>
        <h3>Detaylı Arama & Filtreleme</h3>
    </div>
    <p class="filter-desc">Aradığınız gayrimenkul, vasıta veya ürünün özelliklerine göre hemen filtreleyin.</p>
    
    <div class="filter-grid">
        <div class="form-group">
            <label for="categorySelect">Kategori Seçin</label>
            <select id="categorySelect" class="form-control" onchange="syncCategoryFromDropdown(this.value)">
                <option value="">Tüm Kategoriler</option>
                
                <!-- 1. Emlak -->
                <optgroup label="1. Emlak">
                    <option value="Konut (Daire, Villa)">Konut (Daire, Villa)</option>
                    <option value="İşyeri">İşyeri</option>
                    <option value="Arsa">Arsa</option>
                </optgroup>

                <!-- 2. Vasıta -->
                <optgroup label="2. Vasıta">
                    <option value="Otomobil">Otomobil</option>
                    <option value="Motosiklet">Motosiklet</option>
                    <option value="Arazi, SUV & Pickup">Arazi, SUV & Pickup</option>
                </optgroup>

                <!-- 3. Yedek Parça & Tuning -->
                <optgroup label="3. Yedek Parça & Tuning">
                    <option value="Otomotiv Ekipmanları">Otomotiv Ekipmanları</option>
                    <option value="Motosiklet Ekipmanları">Motosiklet Ekipmanları</option>
                </optgroup>

                <!-- 4. Alışveriş -->
                <optgroup label="4. Alışveriş (İkinci El/Sıfır)">
                    <option value="Alışveriş / Elektronik">Alışveriş / Elektronik</option>
                    <option value="Ev Eşyası">Ev Eşyası</option>
                </optgroup>

                <!-- 5. İş İlanları -->
                <optgroup label="5. İş İlanları">
                    <option value="Arayan ve İlanlar">Arayan ve İlanlar</option>
                </optgroup>

                <!-- 6. Hizmetler -->
                <optgroup label="6. Hizmetler">
                    <option value="Nakliye Hizmeti">Nakliye Hizmeti</option>
                    <option value="Tadilat & Dekorasyon">Tadilat & Dekorasyon</option>
                </optgroup>

                <!-- 7. İş Makineleri & Sanayi -->
                <optgroup label="7. İş Makineleri & Sanayi">
                    <option value="İş Makineleri">İş Makineleri</option>
                    <option value="Sanayi Elektriği & Ekipmanları">Sanayi Elektriği & Ekipmanları</option>
                </optgroup>

                <!-- 8. Evcil Hayvan -->
                <optgroup label="8. Evcil Hayvan">
                    <option value="Evcil Hayvan">Evcil Hayvan</option>
                    <option value="Mama & Aksesuar">Mama & Aksesuar</option>
                </optgroup>

                <!-- 9. Özel Ders Verenler -->
                <optgroup label="9. Özel Ders Verenler">
                    <option value="Lise & Üniversite Takviye">Lise & Üniversite Takviye</option>
                    <option value="Yabancı Dil Eğitmeni">Yabancı Dil Eğitmeni</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="minPrice">Minimum Fiyat (TL)</label>
            <input type="number" id="minPrice" class="form-control" placeholder="Min TL">
        </div>

        <div class="form-group">
            <label for="maxPrice">Maksimum Fiyat (TL)</label>
            <input type="number" id="maxPrice" class="form-control" placeholder="Max TL">
        </div>
    </div>

    <button type="button" class="btn-filter-action">İlanları Filtrele</v>
</div>
