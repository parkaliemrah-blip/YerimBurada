<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YerimBurada - Profesyonel İlan Sistemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern Tasarım */
        :root { --yb-turuncu: #ff3b00; --yb-karanlik: #090d16; }
        body { background: #f3f4f6; font-family: 'Inter', sans-serif; }
        .main-layout { display: flex; gap: 20px; max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .sidebar { width: 300px; background: #fff; padding: 20px; border-radius: 10px; }
        .content-area { flex: 1; background: #fff; padding: 30px; border-radius: 10px; }
        .filter-section { border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px; background: #fafafa; }
        .btn-orange { background: var(--yb-turuncu); color: #fff; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- SOL KATALOG -->
    <div class="sidebar">
        <h3>KATEGORİLER</h3>
        <div onclick="yukle('konut')" class="cat-header">1. Emlak</div>
        <div onclick="yukle('otomobil')" class="cat-header">2. Vasıta</div>
    </div>

    <!-- SAĞ DİNAMİK ALAN -->
    <div class="content-area">
        <div id="filter-container" class="filter-section">
            <h3>Kategori Bazlı Dinamik Filtre</h3>
            <div id="dynamic-inputs"></div>
            <div id="results-bar" style="margin-top:15px; font-weight:bold;"></div>
        </div>
    </div>
</div>

<script>
    const data = {
        konut: {
            title: "Konut Filtreleri",
            inputs: `<select><option>1+1</option><option>2+1</option></select><input type="text" placeholder="m²">`
        },
        otomobil: {
            title: "Vasıta Filtreleri",
            inputs: `<select><option>BMW</option><option>Mercedes</option></select><input type="text" placeholder="KM">`
        }
    };

    function yukle(cat) {
        const target = data[cat];
        document.getElementById('dynamic-inputs').innerHTML = `<h4>${target.title}</h4>${target.inputs}`;
        document.getElementById('results-bar').innerHTML = "1.420 İlan Bulundu <button class='btn-orange'>Listele</button>";
    }
</script>

</body>
</html>
