<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YerimBurada - Türkiye'nin En Büyük Ticaret Ağı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --yb-turuncu: #ff3b00; --yb-karanlik: #090d16; }
        /* Tasarım sistemi öncekiyle aynı profesyonellikte korunmuştur */
        body { background: #f3f4f6; font-family: 'Inter', sans-serif; }
        .sidebar { background: #fff; padding: 20px; border-radius: 12px; }
        .cat-item { margin-bottom: 10px; }
        .btn-orange { background: var(--yb-turuncu); color: #fff; padding: 12px 25px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header ve Auth sistemi korunmuştur -->

    <div class="main-layout">
        <!-- 10 Dev Kategori Katalogu -->
        <div class="sidebar">
            <h3>YERİMBURADA KATEGORİLER</h3>
            <div id="kategori-listesi"></div>
        </div>

        <div class="content-area">
            <!-- İlan Verme ve Dinamik Filtreleme Paneli -->
            <div id="dynamic-panel" class="panel-section active">
                <h2 id="panel-title">Kategori Seçin</h2>
                <div id="form-container"></div>
            </div>
        </div>
    </div>

    <script>
        // 10 Dev Kategori Verisi
        const anaKategoriler = [
            { icon: "fa-home", ad: "Emlak", alt: ["Konut", "İş Yeri", "Arsa", "Projeler"] },
            { icon: "fa-car", ad: "Vasıta", alt: ["Otomobil", "Motosiklet", "Ticari", "Deniz/Hava"] },
            { icon: "fa-cogs", ad: "Yedek Parça", alt: ["Oto Ekipman", "Jant/Lastik", "Tuning"] },
            { icon: "fa-shopping-bag", ad: "Alışveriş", alt: ["Bilgisayar", "Telefon", "Ev Elektroniği", "Beyaz Eşya", "Giyim"] },
            { icon: "fa-briefcase", ad: "İş İlanları", alt: ["Sektörel İlanlar", "Part-Time", "Staj"] },
            { icon: "fa-concierge-bell", ad: "Hizmetler", alt: ["Nakliye", "Tamirat", "Temizlik", "Özel Ders"] },
            { icon: "fa-industry", ad: "İş Makinaları", alt: ["İş Makineleri", "Tarım", "Sanayi", "Enerji"] },
            { icon: "fa-paw", ad: "Evcil Hayvan", alt: ["Canlılar", "Aksesuarlar", "Mama/Bakım"] },
            { icon: "fa-chalkboard-teacher", ad: "Özel Ders", alt: ["Akademik", "Dil", "Müzik", "Spor"] },
            { icon: "fa-hands-helping", ad: "Yardımcı Arayanlar", alt: ["Bakıcı", "Temizlikçi"] }
        ];

        // Katalogu Oluştur
        function katalogOlustur() {
            const list = document.getElementById('kategori-listesi');
            anaKategoriler.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'cat-item';
                item.innerHTML = `<div class="cat-header" onclick="toggleSub('${cat.ad}')"><span><i class="fa ${cat.icon}" style="color:var(--yb-turuncu); width:20px;"></i> ${cat.ad}</span><i class="fa fa-chevron-down"></i></div>`;
                list.appendChild(item);
            });
        }
        
        katalogOlustur();
        
        // Diğer fonksiyonlar (ilanYayinla, fiyatFormatla vb.) korunmuştur.
    </script>
</body>
</html>
