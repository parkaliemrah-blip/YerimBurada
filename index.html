<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YerimBurada - Dinamik Filtreleme Mimarisi</title>
    <style>
        .filter-panel { padding: 20px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
        .dynamic-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .hidden { display: none; }
        .results-bar { margin-top: 20px; padding: 15px; background: #ff3b00; color: #fff; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="filter-panel">
        <!-- 1. Kategori Seçimi -->
        <select id="mainCategory" onchange="loadFilters()">
            <option value="">Kategori Seçiniz</option>
            <option value="konut">Konut (Emlak)</option>
            <option value="otomobil">Otomobil (Vasıta)</option>
        </select>

        <!-- 2. Dinamik Filtreler Buraya Gelecek -->
        <div id="dynamicFilters" class="dynamic-fields"></div>

        <!-- 3. Canlı Sayaçlı Buton -->
        <div id="resultsBar" class="results-bar hidden" onclick="alert('İlanlar listeleniyor...')">
            0 İlan bulundu, sonuçları göster
        </div>
    </div>

<script>
    // Filtre Veritabanı
    const filterConfig = {
        konut: `
            <input type="number" placeholder="Min m²">
            <input type="number" placeholder="Max m²">
            <select><option>1+1</option><option>2+1</option><option>3+1</option></select>
            <select><option>Zemin</option><option>Ara Kat</option><option>Çatı</option></select>
        `,
        otomobil: `
            <select><option>Marka Seç</option><option>BMW</option><option>Mercedes</option></select>
            <input type="number" placeholder="Min KM">
            <select><option>Otomatik</option><option>Manuel</option></select>
            <select><option>Benzin</option><option>Dizel</option><option>Elektrik</option></select>
        `
    };

    function loadFilters() {
        const cat = document.getElementById('mainCategory').value;
        const container = document.getElementById('dynamicFilters');
        const bar = document.getElementById('resultsBar');

        if (cat && filterConfig[cat]) {
            container.innerHTML = filterConfig[cat];
            bar.classList.remove('hidden');
            // Burada canlı sayaç simülasyonu yapabilirsin
            bar.innerText = Math.floor(Math.random() * 500) + " İlan bulundu, sonuçları göster";
        } else {
            container.innerHTML = '';
            bar.classList.add('hidden');
        }
    }
</script>

</body>
</html>
