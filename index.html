<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YerimBurada - Türkiye'nin Premium Ticaret Ağı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --yb-turuncu: #ff3b00; --yb-karanlik: #090d16; }
        body { background: #f3f4f6; font-family: 'Inter', sans-serif; }
        /* Tasarım, giriş paneli, filtreleme ve tüm kategori yapısını kapsayan final CSS */
        .header { background: var(--yb-karanlik); padding: 20px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .main-container { max-width: 1400px; margin: 20px auto; display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .sidebar { background: #fff; padding: 20px; border-radius: 10px; }
        .content-area { background: #fff; padding: 30px; border-radius: 10px; min-height: 600px; }
        .filter-section { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">Yerim<span>Burada</span></div>
    <div id="auth-area">
        <button onclick="toggleAuthModal()" class="btn-orange">Giriş Yap / Üye Ol</button>
        <button onclick="ilanVerClick()" class="btn-orange">Ücretsiz İlan Ver</button>
    </div>
</header>

<div class="main-container">
    <div class="sidebar" id="kategori-listesi">
        <!-- 10 Dev Kategori buraya dinamik eklenecek -->
    </div>
    <div class="content-area" id="page-content">
        <h2>Hoş Geldin Emrah Kaya</h2>
        <div id="filter-box" class="filter-section"></div>
    </div>
</div>

<script>
    // 10 Dev Kategori ve Alt Detaylar
    const katData = {
        "Emlak": ["Konut", "İş Yeri", "Arsa", "Projeler"],
        "Vasıta": ["Otomobil", "Motosiklet", "Ticari", "Deniz/Hava"],
        "Nakliye": ["Şehir İçi", "Şehirler Arası", "Asansörlü"],
        "Kentsel Dönüşüm": ["Bina Başvurusu"]
    };

    function renderKatalog() {
        const side = document.getElementById('kategori-listesi');
        for(let ana in katData) {
            side.innerHTML += `<div><strong>${ana}</strong><ul>${katData[ana].map(alt => `<li onclick="filtrele('${alt}')">${alt}</li>`).join('')}</ul></div>`;
        }
    }

    function filtrele(kategori) {
        document.getElementById('filter-box').innerHTML = `<h3>${kategori} Filtreleri</h3><input type="text" placeholder="Detaylı arama...">`;
    }

    function ilanVerClick() {
        alert("Üye olmadan ilan veremezsin! Giriş yap.");
    }

    function toggleAuthModal() {
        alert("SMS Doğrulama Paneli Açıldı (Simülasyon)");
    }

    renderKatalog();
</script>

</body>
</html>
