<script>
    // 1. Kategoriler arası geçişi sağlayan profesyonel fonksiyon
    function kategoriSec(katAdi) {
        // Sol menüde aktif olanı görselleştir
        document.querySelectorAll('.cat-sub li').forEach(el => el.style.fontWeight = 'normal');
        event.target.style.fontWeight = 'bold';
        event.target.style.color = 'var(--yb-turuncu)';

        // Sağdaki başlığı güncelle
        document.getElementById('kategori-baslik').innerHTML = `<i class="fa fa-filter" style="color:var(--yb-turuncu);"></i> Seçilen Kategori: ${katAdi}`;
        document.getElementById('kategori-aciklama').innerText = `"${katAdi}" kategorisi için filtreler yüklendi.`;

        // Filtre dropdown'ını da otomatik güncelle
        const dropdown = document.getElementById('filtre-kategori');
        dropdown.value = katAdi; // Eğer option değerleri ile isimler uyuşuyorsa
        
        showPage('vitrin');
    }

    // 2. Fiyat formatlama (5.000.000 gibi görünmesi için)
    function fiyatFormatla(input) {
        let value = input.value.replace(/\D/g, '');
        if (value === "") return;
        input.value = new Intl.NumberFormat('tr-TR').format(value);
    }

    // 3. Kullanıcı Giriş Kontrolü
    function kontrolVeIlanVer() {
        if (!kullaniciGirisYapildi) {
            toggleAuthModal();
        } else {
            showPage('ilanver');
        }
    }

    // 4. Dinamik Filtreleme Mantığı (Gelişmiş)
    document.getElementById('filtre-kategori').addEventListener('change', function() {
        const secilen = this.value;
        if(secilen) {
            // Burada kategoriye göre ek filtre alanları türetebiliriz
            console.log("Filtreleme şuna göre yapılacak:", secilen);
        }
    });

    // 5. İlan Yayınla - Esnaf Ağına Gönder
    function ilanYayinla() {
        const baslik = document.getElementById('ilan-baslik').value;
        if(!baslik) {
            alert("Lütfen başlık giriniz.");
            return;
        }
        // İlan verisini buraya toplayıp veritabanına (Supabase vb.) göndereceğiz
        alert("İlanınız başarıyla YerimBurada ağında yayınlandı!");
        showPage('vitrin');
    }
</script>
